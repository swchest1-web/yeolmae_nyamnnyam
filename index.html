<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>열매냠냠</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#E8453C;--red-l:#FDECEA;--red-d:#B53029;--grn:#2E7D50;--grn-l:#E8F5ED;--grn-d:#1B5235;--g1:#F5F4F2;--g2:#E8E6E1;--g3:#AEACA6;--g4:#6B6966;--g5:#2C2C2A;--blue:#1565C0;--blue-l:#E3EEFF;--shadow:0 2px 12px rgba(0,0,0,0.09);--r8:8px;--r12:12px;--r16:16px;}
html{height:100%}
body{font-family:-apple-system,"Noto Sans KR",sans-serif;background:#FFF8F7;color:var(--g5);height:100%;margin:0}
#loading{position:fixed;inset:0;background:#FFF8F7;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:9999}
.dots{display:flex;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:bop .8s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes bop{0%,60%,100%{transform:scale(1)}30%{transform:scale(1.5)}}
/* PC: 전체화면 flex */
#app{display:none;flex-direction:column;height:100vh;overflow:hidden}
.header{background:#fff;border-bottom:0.5px solid var(--g2);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{display:flex;align-items:center;gap:9px}
.logo-text{font-size:17px;font-weight:800;color:var(--red)}
.logo-sub{font-size:10px;color:var(--g3);display:block;margin-top:-2px}
.hdr-right{display:flex;gap:7px;align-items:center}
.sync-badge{font-size:10px;color:var(--g3);background:var(--g1);border-radius:20px;padding:3px 10px}
.btn-refresh{background:var(--grn-l);color:var(--grn);border:none;border-radius:var(--r8);padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer}
.filter-bar{background:#fff;border-bottom:0.5px solid var(--g2);padding:6px 14px;display:flex;flex-direction:column;gap:0;flex-shrink:0}
.frow{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:0.5px solid var(--g1)}
.frow:last-child{border-bottom:none}
.flabel{font-size:11px;color:var(--g4);font-weight:700;white-space:nowrap;min-width:32px;flex-shrink:0}
.chips{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{border:0.5px solid var(--g2);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--g4);background:#fff;cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none;flex-shrink:0}
.chip:hover{border-color:var(--red);color:var(--red)}
.chip.on{background:var(--red-l);border-color:var(--red);color:var(--red);font-weight:700}
.togw{display:flex;align-items:center;gap:5px;cursor:pointer;flex-shrink:0}
.tog{width:29px;height:16px;background:var(--g2);border-radius:8px;position:relative;transition:background .2s;flex-shrink:0}
.tog.on{background:var(--grn)}.tog-cherry.on{background:#C2185B}
.togk{width:12px;height:12px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:left .2s}
.tog.on .togk{left:15px}
.toglabel{font-size:11px;color:var(--g4);white-space:nowrap}
.search-bar{padding:8px 14px;background:#fff;border-bottom:0.5px solid var(--g2);flex-shrink:0;display:flex;align-items:center;gap:8px}
.search-wrap{flex:1;display:flex;align-items:center;gap:7px;background:var(--g1);border-radius:var(--r8);padding:7px 13px;border:0.5px solid var(--g2)}
.search-wrap input{border:none;outline:none;background:transparent;font-size:13px;color:var(--g5);flex:1;min-width:0}
.search-wrap input::placeholder{color:var(--g3)}
.result-info{font-size:12px;color:var(--g4);white-space:nowrap}
.result-info strong{color:var(--red);font-weight:800}
.sort-sel{border:0.5px solid var(--g2);border-radius:var(--r8);padding:6px 10px;font-size:12px;color:var(--g4);background:#fff;cursor:pointer;outline:none;flex-shrink:0}
/* MAIN */
.main{display:flex;flex:1;min-height:0;overflow:hidden}
.card-grid{flex:1;overflow-y:auto;padding:14px;padding-bottom:76px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;align-content:start;background:var(--g1)}
/* CARD */
.card{background:#fff;border-radius:var(--r16);border:0.5px solid var(--g2);cursor:pointer;display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s,transform .1s}
.card:hover{border-color:var(--red);box-shadow:0 4px 16px rgba(232,69,60,.1);transform:translateY(-1px)}
.card.active{border-color:var(--red);border-width:1.5px}
.card.certified{border-color:#F8BBD0}
.card.certified .ctop{background:linear-gradient(135deg,#FFF8F7,#FFF0F5)}
.cherry-badge{display:inline-block;font-size:10px;background:#FCE4EC;color:#C2185B;border-radius:20px;padding:2px 8px;font-weight:700;margin-left:5px;vertical-align:middle;border:0.5px solid #F48FB1}
.ctop{padding:13px 14px 8px;flex:1}
.chd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px;gap:6px}
.pname{font-size:14px;font-weight:700;line-height:1.3;word-break:keep-all}
.cbadge{font-size:10px;border-radius:20px;padding:2px 8px;font-weight:700;white-space:nowrap;flex-shrink:0}
.cb-한식{background:#FFF3E0;color:#BF360C}.cb-양식{background:#E3F2FD;color:#0D47A1}.cb-중식{background:#F3E5F5;color:#4A148C}.cb-기타{background:#E8F5E9;color:#1B5E20}.cb-카페{background:#FFF8E1;color:#E65100}.cb-일식{background:#E8F4F8;color:#006064}.cb-샐러드{background:#F1F8E9;color:#33691E}.cb-분식{background:#FBE9E7;color:#BF360C}
.cmeta{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.mtag{font-size:10px;background:var(--g1);color:var(--g4);border-radius:4px;padding:2px 6px}
.mtag.room{background:var(--grn-l);color:var(--grn-d);font-weight:700}
.mtag.del{background:var(--blue-l);color:var(--blue);font-weight:700}
.cdesc{font-size:11px;color:var(--g3);line-height:1.5}
.cfoot{padding:9px 14px;display:flex;align-items:center;justify-content:space-between;border-top:0.5px solid var(--g1);flex-shrink:0}
.wbadge{font-size:11px;color:var(--grn);font-weight:700}
.cbtns{display:flex;gap:5px}
.bsm{border:0.5px solid var(--g2);background:#fff;color:var(--g4);border-radius:var(--r8);padding:5px 10px;font-size:11px;cursor:pointer}
.bsm.active-btn{background:var(--red);color:#fff;border-color:var(--red)}
.bcall{background:var(--grn);color:#fff;border:none;border-radius:var(--r8);padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer}
.empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--g3)}
.empty-state .ei{font-size:44px;margin-bottom:14px}
/* SIDE PANEL */
.side-panel{width:400px;flex-shrink:0;border-left:0.5px solid var(--g2);background:#fff;overflow-y:auto;display:none;flex-direction:column}
.panel-top-bar{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:0.5px solid var(--g2);flex-shrink:0;background:#fff;position:sticky;top:0;z-index:5}
.panel-close-btn{background:var(--g1);border:0.5px solid var(--g2);border-radius:var(--r8);padding:5px 12px;font-size:12px;color:var(--g4);cursor:pointer;font-weight:600}
.panel-body{padding:16px 18px 24px}
.panel-name{font-size:20px;font-weight:800;margin-bottom:3px}
.panel-addr{font-size:11px;color:var(--g3);margin-bottom:12px;line-height:1.5}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.info-cell{background:var(--g1);border-radius:var(--r8);padding:9px 11px}
.info-key{font-size:10px;color:var(--g3);margin-bottom:2px}
.info-val{font-size:13px;font-weight:700}
.info-val.green{color:var(--grn)}
.panel-sec{font-size:13px;font-weight:700;margin:14px 0 8px;border-top:0.5px solid var(--g2);padding-top:12px}
.review-box{background:var(--g1);border-radius:var(--r8);padding:11px;margin-bottom:7px}
.review-src{font-size:10px;background:#FFF9C4;color:#F57F17;border-radius:4px;padding:2px 6px;font-weight:700;margin-right:5px}
.review-by{font-size:10px;color:var(--g3)}
.review-text{font-size:12px;color:var(--g4);line-height:1.6;margin-top:5px}
.panel-actions{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.btn-primary{background:var(--red);color:#fff;border:none;border-radius:var(--r12);padding:12px;font-size:13px;font-weight:700;cursor:pointer;width:100%}
.btn-naver{background:#03C75A;color:#fff;border:none;border-radius:var(--r12);padding:11px;font-size:13px;font-weight:700;cursor:pointer;width:100%;text-align:left}
.btn-photo{background:var(--g1);border:0.5px solid var(--g2);color:var(--g4);border-radius:var(--r12);padding:11px 14px;font-size:13px;cursor:pointer;width:100%;text-align:left}
.btn-blog-action{background:#fff;border:1px solid var(--g2);color:var(--g4);border-radius:var(--r12);padding:11px 14px;font-size:13px;cursor:pointer;width:100%}
.no-review{font-size:12px;color:var(--g3);text-align:center;padding:14px;background:var(--g1);border-radius:var(--r8);margin-bottom:8px}
.staff-review{background:var(--g1);border-radius:var(--r8);padding:10px 12px;margin-bottom:7px;border-left:3px solid var(--red-l)}
.staff-review-head{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap}
.staff-name{font-size:12px;font-weight:700}.staff-stars{font-size:12px}.staff-date{font-size:10px;color:var(--g3);margin-left:auto}
.staff-review-text{font-size:12px;color:var(--g4);line-height:1.6}
.review-form{background:#FFF8F7;border:1px solid var(--red-l);border-radius:var(--r12);padding:14px;margin-top:14px}
.review-form-title{font-size:13px;font-weight:700;margin-bottom:10px}
.star-row{display:flex;gap:4px;margin-bottom:10px}
.star{font-size:22px;cursor:pointer;user-select:none}
.review-author{width:100%;border:0.5px solid var(--g2);border-radius:var(--r8);padding:8px 11px;font-size:12px;margin-bottom:7px;outline:none;background:#fff}
.review-input{width:100%;border:0.5px solid var(--g2);border-radius:var(--r8);padding:9px 11px;font-size:12px;resize:none;outline:none;font-family:inherit;background:#fff;line-height:1.6}
.btn-submit-review{width:100%;background:var(--red);color:#fff;border:none;border-radius:var(--r8);padding:10px;font-size:13px;font-weight:700;cursor:pointer;margin-top:8px}
.btn-submit-review:disabled{background:var(--g3);cursor:not-allowed}
/* 모달 */
.ai-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.ai-modal-bg.open{display:flex}
.ai-modal{background:#fff;border-radius:20px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.18)}
.ai-modal-header{padding:16px 18px;border-bottom:0.5px solid var(--g2);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:2;border-radius:20px 20px 0 0}
.ai-modal-title{font-size:16px;font-weight:800;color:#fff}
.ai-modal-close{background:rgba(255,255,255,.2);border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:14px;color:#fff}
.ai-modal-body{padding:16px 18px 24px}
/* 마스코트 */
.mascot-float{position:fixed;bottom:76px;right:18px;z-index:400;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.mbubble{background:#fff;border-radius:12px;padding:5px 11px;font-size:11px;color:#B53029;font-weight:700;border:1px solid var(--red-l);white-space:nowrap;box-shadow:var(--shadow)}
/* 배너 */
.banner-bar{height:62px;background:#fff;border-top:0.5px solid var(--g2);overflow:hidden;cursor:pointer;position:fixed;bottom:0;left:0;right:0;z-index:200}
.banner-track{display:flex;height:100%;transition:transform .5s ease}
.banner-slide{min-width:100%;height:100%;display:flex;align-items:center;gap:14px;padding:0 20px;cursor:pointer;user-select:none}
.banner-img{font-size:24px;flex-shrink:0}
.banner-text{flex:1;min-width:0}
.banner-title{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner-desc{font-size:11px;color:rgba(255,255,255,.75);margin-top:2px}
.banner-arrow{font-size:16px;color:rgba(255,255,255,.65);flex-shrink:0}
.banner-dots{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.banner-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer}
.banner-dot.on{background:rgba(255,255,255,.9)}
/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--g5);color:#fff;border-radius:20px;padding:10px 20px;font-size:13px;z-index:9000;transition:transform .3s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
/* 모바일 */
@media(max-width:768px){
  /* 모바일: html/body 고정, 카드만 스크롤 */
  html,body{height:100%;overflow:hidden}
  #app{height:100vh;overflow:hidden;display:flex;flex-direction:column}
  .header{padding:0 12px;height:48px;flex-shrink:0}
  .logo-text{font-size:16px}
  .logo-sub,.sync-badge{display:none}
  .btn-refresh{font-size:12px;padding:6px 11px}
  .filter-bar{padding:4px 10px;flex-shrink:0}
  .frow{padding:5px 0}
  .flabel{font-size:13px;min-width:40px}
  .chip{padding:5px 12px;font-size:13px}
  .toglabel{font-size:13px}
  .search-bar{padding:7px 10px;gap:6px;flex-shrink:0}
  .search-wrap input{font-size:14px}
  .sort-sel{font-size:12px;padding:6px 8px}
  /* 핵심: main이 남은 공간 차지, card-grid가 스크롤 */
  .main{display:flex;flex:1;overflow:hidden;min-height:0}
  .card-grid{flex:1;overflow-y:auto;padding:10px;padding-bottom:10px;
    display:block;grid-template-columns:unset;height:auto}
  .card{margin-bottom:10px;border-radius:14px}
  .pname{font-size:15px}
  .cbadge,.cherry-badge{font-size:12px}
  .mtag{font-size:11px}
  .cdesc{font-size:12px}
  .bsm,.bcall{font-size:12px;padding:7px 10px}
  /* 패널 */
  .side-panel{width:100% !important;position:fixed;inset:0;z-index:500;overflow-y:auto;border-left:none;display:none;flex-direction:column}
  .panel-body{padding:14px 14px 90px}
  /* 마스코트 — 배너 위에 위치 */
  .mascot-float{bottom:64px;right:10px;z-index:400}
  .mascot-float img{width:60px;height:60px}
  .mbubble{font-size:10px;padding:3px 9px}
  /* 배너 — fixed 고정 */
  .banner-bar{height:54px;position:fixed;bottom:0;left:0;right:0;z-index:200}
}
</style>
</head>

  return PEOPLE_ORDER.includes(s)?s:"";
}
function cleanPlace(p){
  p["최대수용인원"]=normPeople(p["최대수용인원"]);
  p["도보(분)"]=parseInt(p["도보(분)"])||0;
  var rc=p["룸개수"];p["룸개수_원본"]=String(rc||"");
  p["룸개수"]=(!isNaN(rc)&&rc!=="")?parseInt(rc):null;
  if(p["등록일"]&&String(p["등록일"]).includes("T")){try{p["등록일"]=new Date(p["등록일"]).toLocaleDateString("ko-KR");}catch(e){}}
  return p;
}

function setChip(el,group){
  var val=el.dataset.v;var cur=multiFilters[group];
  var isAll=(val==="전체"||val==="0");
  if(isAll){
    multiFilters[group]=[val];
    document.querySelectorAll("[data-g="+group+"]").forEach(function(c){c.classList.toggle("on",c.dataset.v===val);});
  } else {
    var allEl=document.querySelector("[data-g="+group+"][data-v=전체],[data-g="+group+"][data-v=\"0\"]");
    if(allEl)allEl.classList.remove("on");
    var idx=cur.indexOf(val);
    if(idx>=0){cur.splice(idx,1);el.classList.remove("on");}
    else{cur.push(val);el.classList.add("on");}
    var remain=cur.filter(function(v){return v!=="전체"&&v!=="0";});
    if(remain.length===0){
      var rv=group==="walk"?"0":"전체";
      multiFilters[group]=[rv];
      document.querySelectorAll("[data-g="+group+"]").forEach(function(c){c.classList.toggle("on",c.dataset.v===rv);});
    } else {multiFilters[group]=remain;}
  }
  applyFilters();
}
function toggleF(key){
  filters[key]=!filters[key];
  var el=document.getElementById("tog-"+key);if(el)el.classList.toggle("on",filters[key]);
  applyFilters();
}
function applyFilters(){
  var list=allPlaces.slice();
  var types=multiFilters.type;
  if(!types.includes("전체"))list=list.filter(function(p){return types.includes(p["유형"]);});
  var foods=multiFilters.food;
  if(!foods.includes("전체"))list=list.filter(function(p){return foods.includes(p["음식분류"]);});
  var budgets=multiFilters.budget;
  if(!budgets.includes("전체"))list=list.filter(function(p){return budgets.includes(p["예산등급"]);});
  if(!multiFilters.people.includes("전체")){
    list=list.filter(function(p){
      var pi=PEOPLE_ORDER.indexOf(normPeople(p["최대수용인원"]));
      return multiFilters.people.some(function(fv){var fi=PEOPLE_ORDER.indexOf(fv);return pi>=0&&fi>=0&&pi>=fi;});
    });
  }
  var walks=multiFilters.walk;
  if(!walks.includes("0")){
    if(walks.includes("99")){
      list=list.filter(function(p){return Number(p["도보(분)"]||0)>15;});
    } else {
      var maxW=Math.max.apply(null,walks.filter(function(v){return v!=="99";}).map(Number));
      list=list.filter(function(p){return Number(p["도보(분)"]||99)<=maxW;});
    }
  }
  if(filters.room)list=list.filter(function(p){return p["룸보유"]==="Y";});
  if(filters.delivery)list=list.filter(function(p){return p["배달가능"]==="Y";});
  if(filters.reservation)list=list.filter(function(p){return p["예약가능"]==="Y";});
  if(filters.certified)list=list.filter(function(p){return String(p["열매인증"]||"").trim()==="O";});
  filteredPlaces=list;
  sortPlaces(document.querySelector(".sort-sel")?document.querySelector(".sort-sel").value:"walk");
}
function sortPlaces(mode){
  var bi=function(p){return BUDGET_ORDER.indexOf(p["예산등급"]);};
  var pi2=function(p){return PEOPLE_ORDER.indexOf(normPeople(p["최대수용인원"]));};
  filteredPlaces.sort(function(a,b){
    if(mode==="walk")return(Number(a["도보(분)"])||99)-(Number(b["도보(분)"])||99);
    if(mode==="budget_asc")return bi(a)-bi(b);
    if(mode==="people")return pi2(a)-pi2(b);
    return 0;
  });
  renderCards();
}
function liveSearch(q){
  if(!q){applyFilters();return;}
  filteredPlaces=allPlaces.filter(function(p){

function submitReview(name,idx){
  var content=document.getElementById("review-"+idx).value.trim();
  var author=document.getElementById("author-"+idx).value.trim()||"익명";

  if(!content){showToast("⚠️ 후기 내용을 입력해 주세요.");return;}
  var btn=document.querySelector("#panel-inner .btn-submit-review");
  if(btn){btn.textContent="저장 중…";btn.disabled=true;}
  fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({place:name,rating:rating,content:content,author:author})})
  .then(function(r){return r.json();})
  .then(function(res){
    if(res.success){
      allReviews.push({place:name,rating:rating,content:content,author:author,date:new Date().toLocaleString("ko-KR")});
      var el=document.getElementById("review-list-"+idx);if(el)el.innerHTML=renderReviewList(name);
      document.getElementById("review-"+idx).value="";document.getElementById("author-"+idx).value="";
      starRatings[idx]=0;setStar(idx,0);showToast("✅ 후기가 등록됐어요!");
    }
  }).catch(function(){showToast("❌ 저장 실패");})
  .then(function(){var b=document.querySelector("#panel-inner .btn-submit-review");if(b){b.textContent="등록하기";b.disabled=false;}});
}

window.addEventListener("DOMContentLoaded", function(){

});

function getRandomPicks(n){
  // 1만원대 우선, 없으면 전체에서 랜덤
  var affordable = allPlaces.filter(function(p){ return p['예산등급']==='1만원대'; });
  var list = affordable.length >= n ? affordable : allPlaces.slice();
  var picks=[];
  while(picks.length<n && list.length>0){
    var idx=Math.floor(Math.random()*list.length);
    picks.push(list.splice(idx,1)[0]);
  }
  return picks;
}

async function renderTodayRec(picks){
  var bodyEl=document.getElementById('rec-modal-body');
  if(!picks.length){
    bodyEl.innerHTML='<div style="padding:20px;text-align:center;color:var(--g3);font-size:13px">데이터가 없어요 😢</div>';
    return;
  }

  // Claude API로 추천 이유 생성
  var dbText=picks.map(function(p,i){
    return (i+1)+'. '+p['상호명']+' | '+p['음식분류']+' | '+p['예산등급']+
      ' | 도보 '+p['도보(분)']+'분'+(p['룸보유']==='Y'?' | 룸 있음':'')+
      (p['후기요약']?' | '+p['후기요약']:'');
  }).join('\n');

  var prompt='다음 3개 맛집 각각에 대해 "오늘 이곳 어떠세요?" 느낌으로 한 줄 추천 멘트를 써주세요.\n'+
    '형식: 번호. 한 줄 멘트 (이모지 포함, 20자 내외)\n\n'+dbText;

  var reasons=['✨ 오늘도 맛있게!','🍽 오늘의 선택!','🎯 오늘 딱 좋아요!'];

  try{
    var res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:300,
        messages:[{role:'user',content:prompt}]})
    });
    var data=await res.json();
    if(data.content && data.content[0]){
      var lines=data.content[0].text.split('\n').filter(function(l){return l.trim();});
      picks.forEach(function(p,i){
        var line=lines[i]||'';
        var match=line.match(/^\d+\.\s*(.+)/);
        reasons[i]=match?match[1].trim():reasons[i];
      });
    }
  }catch(e){}

  // 카드 렌더링
  bodyEl.innerHTML='<div style="padding:4px 0 16px">'+
    picks.map(function(p,i){
      var isCert=String(p['열매인증']||'').trim()==='O';
      var naverUrl=p['네이버지도링크']||'';
      return '<div style="background:var(--g1);border-radius:14px;padding:14px 16px;margin-bottom:10px;'+
        'border-left:4px solid '+(isCert?'#C2185B':'var(--red)')+'">'+
        '<div style="font-size:15px;font-weight:700;margin-bottom:4px">'+
          (isCert?'🍒 ':'')+p['상호명']+
          ' <span style="font-size:10px;background:var(--g2);color:var(--g4);border-radius:4px;padding:1px 6px">'+
          (p['음식분류']||'')+'</span>'+
        '</div>'+
        '<div style="font-size:12px;color:var(--g3);margin-bottom:8px;line-height:1.6">'+
          '💰 '+(p['예산등급']||'-')+' &nbsp;🚶 도보 '+(p['도보(분)']||'?')+'분'+
          (p['룸보유']==='Y'?' &nbsp;🚪 룸 있음':'')+
        '</div>'+
        '<div style="font-size:13px;color:var(--red);font-weight:600;margin-bottom:10px">'+
          reasons[i]+
        '</div>'+
        '<div style="display:flex;gap:6px">'+
          '<button onclick="closeRecModal();selectCardByName(\''+p['상호명'].replace(/'/g,"\\'")+'\');" '+
            'style="flex:1;background:var(--red);color:#fff;border:none;border-radius:8px;'+
            'padding:8px;font-size:12px;font-weight:700;cursor:pointer">자세히 보기</button>'+
          (naverUrl?'<button onclick="openUrl(\''+naverUrl+'\')" '+
            'style="flex:1;background:#03C75A;color:#fff;border:none;border-radius:8px;'+
            'padding:8px;font-size:12px;font-weight:700;cursor:pointer">🗺 네이버지도</button>':'') +
          '<button onclick="callPlace(\''+p['전화번호']+'\')" '+
            'style="flex:1;background:#2E7D50;color:#fff;border:none;border-radius:8px;'+
            'padding:8px;font-size:12px;font-weight:700;cursor:pointer">📞 전화</button>'+
        '</div>'+
      '</div>';
    }).join('')+
    '<button onclick="openTodayRec()" '+
      'style="width:100%;background:var(--g1);border:0.5px solid var(--g2);color:var(--g4);'+
      'border-radius:10px;padding:10px;font-size:13px;font-weight:600;cursor:pointer">'+
      '🔄 다시 추천받기</button>'+
  '</div>';
}

function closeRecModal(){
  document.getElementById('rec-modal-bg').classList.remove('open');
}
</script>
</body>
</html>
